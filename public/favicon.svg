<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- StrideLog mark: three log lines rising like a stride, ending at a mint checkpoint -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c7ff7"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#g)"/>
  <g stroke="#ffffff" stroke-width="44" stroke-linecap="round" fill="none">
    <path d="M128 348 H232" stroke-opacity="0.55"/>
    <path d="M196 264 H300" stroke-opacity="0.8"/>
    <path d="M264 180 H316"/>
  </g>
  <circle cx="380" cy="180" r="36" fill="#34d3a6"/>
</svg>
