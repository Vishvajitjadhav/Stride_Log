<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- StrideLog mark: three log lines rising like a stride, ending at a gold checkpoint -->
  <rect width="512" height="512" rx="112" fill="#1d3254"/>
  <g stroke="#ffffff" stroke-width="44" stroke-linecap="round" fill="none">
    <path d="M128 348 H232" stroke-opacity="0.5"/>
    <path d="M196 264 H300" stroke-opacity="0.78"/>
    <path d="M264 180 H316"/>
  </g>
  <circle cx="380" cy="180" r="34" fill="#c9a43f"/>
</svg>
